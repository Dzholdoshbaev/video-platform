services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
    ports:
      - "5432:5432"
    volumes:
      - streaming_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming -d streaming"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  streaming_postgres_data:
